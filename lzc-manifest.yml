application:
  subdomain: neko-master
  background_task: true
  upstreams:
    - location: /
      backend: http://neko-master:3000/

services:
  neko-master:
    # upstream: ghcr.io/foru17/neko-master:1.4.0
    image: ghcr.1ms.run/foru17/neko-master:1.4.0
    environment:
      - NODE_ENV=production
      - WEB_PORT=3000
      - API_PORT=3001
      - COLLECTOR_WS_PORT=3002
      - DB_PATH=/app/data/stats.db
      - COOKIE_SECRET={{ stable_secret "neko_master_cookie_secret_v1" }}
      - FORCE_ACCESS_CONTROL_OFF={{ .U.force_access_control_off }}
      - CH_ENABLED=0
    binds:
      - /lzcapp/var/data:/app/data
    cpu_shares: 512
    mem_limit: 1024M
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:3001/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

usage: "首次打开后，在设置中添加 Clash、Mihomo 或 Surge 网关。默认关闭 Neko Master 自身访问控制，外部访问由懒猫微服鉴权保护；可在应用配置中开启自身访问控制。"
